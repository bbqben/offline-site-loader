name: Check PWA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check src/app.js
          node --check src/path-utils.mjs
          node --check sw.js
      - name: Unit tests
        run: node --test tests/*.test.mjs
